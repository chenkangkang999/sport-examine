name: 构建与测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: 前端构建 (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [user-web, manage-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: 安装与构建
        working-directory: ${{ matrix.app }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist

  backend:
    name: 后端与独立 MySQL 测试
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: tijian_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: 测试与打包
        working-directory: server
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/tijian_test?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-only-password
        run: mvn --batch-mode package
      - uses: actions/upload-artifact@v4
        with:
          name: health-server-jar
          path: server/target/health-server-*.jar
