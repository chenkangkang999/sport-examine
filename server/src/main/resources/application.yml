server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/tijian?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:health_app}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
health:
  seed-enabled: ${SEED_ENABLED:true}
