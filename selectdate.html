<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
		<link rel="stylesheet" href="framework/font-awesome/css/font-awesome.min.css"/>
		<link rel="stylesheet" href="framework/reset.css"/>
		<link rel="stylesheet" href="css/selectdate.css"/>
		<script src="js/selectdate.js"></script>
		<link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">

	<body>
		<div class="wrapper">
			<header>
				<i class="fa fa-angle-left" onclick="history.go(-1)"></i>

				<div></div>
			</header>
			<div class="top-ban"></div>
			<div class="calendar-content">
				<div id="calendar"></div>
				<div class="selection-info">
					<p>您选择的日期是:<strong><span id="selectedDate">请点击日历进行选择</span></strong></p>
				</div>
			</div>
			
			
			<div class="bottom-ban"></div>
			<div class="botton-btn">
				<div></div>
				<div onclick="location.href='confirmorder.html'">下一步</div>
			</div>
			
			<footer>
				<ul>
					<li onclick="location.href='index.html'">
						<i class="fa fa-home"></i>
						<p>云医院</p>
					</li>
					<li>
						<i class="fa fa-opencart"></i>
						<p>商城</p>
					</li>
					<li>
						<i class="fa fa-compass"></i>
						<p>发现</p>
					</li>
					<li onclick="location.href='personal.html'">
						<i class="fa fa-user"></i>
						<p>我的</p>
					</li>
				</ul>
			</footer>
		</div>

	<!-- FullCalendar JS -->
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/locales/zh-cn.js"></script>
